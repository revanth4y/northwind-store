services:
  postgres:
    image: postgres:16-alpine
    container_name: northwind-store-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: northwind
    ports:
      - "54322:5432"
    volumes:
      - northwind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d northwind"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  northwind_pgdata:
